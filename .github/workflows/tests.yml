name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      # What Qt (PySide6's own copy, from pip) expects from the system to
      # start at all, even with no display: found by running the tests in a
      # bare ubuntu:24.04 container.
      - name: Install the libraries Qt needs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libfontconfig1 libxkbcommon0 libdbus-1-3 libnss3 libnspr4 libasound2t64 \
            libxcomposite1 libxdamage1 libxrandr2 libxtst6 libxkbfile1 libgbm1 libxfixes3 libx11-6 \
            libxext6 libxrender1 libxi6 libglib2.0-0t64 libgssapi-krb5-2
      # PySide6 as well as pytest, so the editor window's own tests
      # (tests/test_window.py) run rather than skip themselves.
      - run: pip install -r requirements-dev.txt -r app/requirements.txt
      - run: make test
        env:
          # No display: Qt draws to memory, and Chromium (Qt WebEngine)
          # runs without a GPU process or its sandbox, which the runner's
          # restrictions on user namespaces don't allow.
          QT_QPA_PLATFORM: offscreen
          QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu --no-sandbox

# Page geometry, header/footer/cue-column sizing, and spacing for
# settings/template.tex. Run `python3 scripts/yaml_to_settings.py` to
# regenerate build/cornell-page-settings.tex, then compile as usual
# (or just `make build`, which does this automatically).
#
# The values below are the template's defaults -- edit them in place to
# change the layout everywhere, since this feeds every page.

# Paper size and uniform margin: any values the LaTeX `geometry` package
# accepts (e.g. paper: a4paper, margin: 20mm).
paper: letterpaper
margin: 0.5in

# Header, footer, and right-hand cue-column sizing, as fractions of the
# drawable page height/width. Must be plain decimals, no units.
header_height: 0.12
footer_height: 0.18
cue_width: 0.25

# Ruled-line spacing, inner text padding, and the safety margin that
# keeps thick strokes inside the printable area. Any LaTeX length.
rule_spacing: 0.25in
padding: 0.12in
border_inset: 2pt

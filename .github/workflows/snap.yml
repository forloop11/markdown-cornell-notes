name: Snap

# Builds the snap (snap/snapcraft.yaml) and attaches it to the run as a
# download, to install and try. Started by hand from the Actions tab; it
# publishes nothing.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: snapcore/action-build@v1
        id: snapcraft
      - uses: actions/upload-artifact@v4
        with:
          name: markdown-cornell-notes-snap
          path: ${{ steps.snapcraft.outputs.snap }}

<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
        font-size: 14px;
        /* Matches editor.js's Dracula theme background so there's no light
           flash/border around the editor before CodeMirror mounts. */
        background: #282a36;
      }
      #toolbar {
        /* border-box for the same reason as #editor below -- its rendered
           height (measured via offsetHeight in mount()) is subtracted from
           the total height budget, so padding/border must count as part of
           that measured height rather than adding on top of it. */
        box-sizing: border-box;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 2px;
        row-gap: 4px;
        padding: 4px;
        background: #21222c;
        border: 1px solid #44475a;
        border-bottom: none;
        border-radius: 4px 4px 0 0;
      }
      #toolbar button {
        box-sizing: border-box;
        background: transparent;
        border: none;
        color: #f8f8f2;
        font-family: inherit;
        font-size: 13px;
        padding: 4px 8px;
        border-radius: 3px;
        cursor: pointer;
        line-height: 1;
      }
      #toolbar button:hover {
        background: #44475a;
      }
      #toolbar .divider {
        width: 1px;
        align-self: stretch;
        margin: 2px 4px;
        background: #44475a;
      }
      #editor {
        /* border-box so the 1px border sits inside the JS-set height
           (see mount() in editor.js) instead of adding 2px on top of it --
           otherwise this pane ends up 2px taller than the PDF pane next to
           it, throwing off their bottom alignment despite both using the
           same nominal height. */
        box-sizing: border-box;
        border: 1px solid #44475a;
        border-radius: 0 0 4px 4px;
      }
      .cm-editor {
        height: 100%;
      }
      .cm-scroller {
        overflow: auto;
      }
    </style>
  </head>
  <body>
    <div id="editor"></div>
    <script src="./bundle.js"></script>
  </body>
</html>

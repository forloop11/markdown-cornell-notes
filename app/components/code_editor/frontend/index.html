<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
        font-size: 14px;
        /* Matches editor.js's Dracula theme background so there's no light
           flash/border around the editor before CodeMirror mounts. */
        background: #282a36;
      }
      #editor {
        border: 1px solid #44475a;
        border-radius: 4px;
      }
      .cm-editor {
        height: 100%;
      }
      .cm-scroller {
        overflow: auto;
      }
    </style>
  </head>
  <body>
    <div id="editor"></div>
    <script src="./bundle.js"></script>
  </body>
</html>

# Page geometry, header/cue-column/summary-band sizing, and spacing for
# settings/template.tex. Run `python3 scripts/yaml_to_settings.py` to
# regenerate build/cornell-page-settings.tex, then compile as usual
# (or just `make build`, which does this automatically).
#
# The values below are the template's defaults -- edit them in place to
# change the layout everywhere, since this feeds every page.

# Paper size and uniform margin: any values the LaTeX `geometry` package
# accepts (e.g. paper: a4paper, margin: 20mm).
paper: letterpaper
margin: 0.25in

# Header, right-hand cue-column, and summary-band sizing, as fractions of
# the drawable page height/width. Must be plain decimals, no units. The
# summary band is the strip at the bottom of the page, full width; it
# holds notes.md's "^^<page> <text>" entries.
header_height: 0.12
cue_width: 0.3
summary_height: 0.2

# Inner text padding and the safety margin that keeps thick strokes
# inside the printable area. Any LaTeX length.
padding: 0.12in
border_inset: 2pt
